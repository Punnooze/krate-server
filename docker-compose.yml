services:
  postgres:
    image: postgres:16
    container_name: krate-postgres
    environment:
      POSTGRES_USER: krate
      POSTGRES_PASSWORD: krate123
      POSTGRES_DB: krate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: krate-redis
    ports:
      - "6379:6379"

  gateway:
    build: ./gateway
    container_name: krate-gateway
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    volumes:
      - ./gateway:/app
      - /app/node_modules
    command: npm run start:dev

  auth:
    build: ./auth
    container_name: krate-auth
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://krate:krate123@postgres:5432/krate
      - JWT_SECRET=supersecretkey123
    volumes:
      - ./auth:/app
      - /app/node_modules
      - /app/src/generated
    command: npm run start:dev

  project-service:
    build: ./project-service
    container_name: krate-project-service
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    volumes:
      - ./project-service:/app
      - /app/node_modules
    command: npm run start:dev

  jobs:
    build: ./jobs
    container_name: krate-jobs
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    volumes:
      - ./jobs:/app
      - /app/node_modules
    command: npm run start:dev

  realtime:
    build: ./realtime
    container_name: krate-realtime
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    volumes:
      - ./realtime:/app
      - /app/node_modules
    command: npm run start:dev

  logs:
    build: ./logs
    container_name: krate-logs
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    volumes:
      - ./logs:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  postgres_data:
